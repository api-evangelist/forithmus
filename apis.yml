aid: forithmus
name: Forithmus
description: 'Forithmus builds foundation models for medical imaging (Zurich, Switzerland; pre-seed backed
  by Point Nine and e2vc). Its developer-facing product is the Forithmus Research Hub, a Challenge Platform
  where research teams host and enter medical-imaging benchmarks by submitting Docker containers or prediction
  files, with leaderboards, credits and compute tiers, collections, forums, and groups. The public REST
  API is served at https://research.forithmus.com/api and described by an OpenAPI 3.1.0 specification
  (172 paths, 213 operations across 24 tags: auth/2FA, challenges, phases, collections, submissions, leaderboard,
  credits, payments, forum, groups, and more). Authentication is Bearer JWT via email/password or Google
  OAuth, with a browser device flow used by the first-party `forithmus` CLI. Forithmus also publishes
  open model/dataset repositories (MR-RATE, VLM3D, FORA) on GitHub.'
